apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sample CRs are applied in test/e2e/verify.sh (not here). Skaffold runs kubectl get -f on
# deployed manifests before apply; homelab Device/Network/IngressRouter kinds are unknown until
# CRDs exist, which breaks that step when samples are bundled in the same manifest.
resources:
  - ../kind
